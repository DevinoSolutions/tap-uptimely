[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[project]
name = "tap-uptimely"
version = "0.1.0"
description = "Singer tap for Uptimely, built with the Meltano Singer SDK."
readme = "README.md"
authors = [{ name = "Devino Solutions", email = "support@getuptimely.com" }]
keywords = ["ELT", "Meltano", "Singer", "Uptimely", "uptime monitoring"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "singer-sdk~=0.53",
  "python-dateutil>=2.9",
  "requests~=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/DevinoSolutions/tap-uptimely"
Documentation = "https://getuptimely.com/docs/api"

[project.scripts]
tap-uptimely = "tap_uptimely.tap:TapUptimely.cli"

[tool.hatch.build.targets.wheel]
packages = ["tap_uptimely"]

[tool.pytest.ini_options]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
